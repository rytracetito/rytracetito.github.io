<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page introuvable | TITO Amedée Rytrace</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('site-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    .nf{ min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; text-align: center; }
    .nf-box{ max-width: 620px; }
    .nf svg{ width: min(460px, 100%); height: auto; margin: 0 auto 28px; overflow: visible; }
    .nf .code{ font-family: var(--font-display); font-weight: 700; font-size: clamp(64px, 14vw, 120px); line-height: 1; letter-spacing: -.04em;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0 0 10px; }
    .nf h1{ font-family: var(--font-display); font-size: clamp(22px, 3.4vw, 30px); margin: 0 0 12px; letter-spacing: -.01em; }
    .nf h1 em{ background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf p{ color: var(--ink-soft); margin: 0 0 30px; }
    .nf .cta-row{ justify-content: center; }
    .nf path{ fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"><span class="g1"></span><span class="g2"></span><span class="g3"></span></div>

  <main class="nf" style="margin:0">
    <div class="nf-box">
      <svg viewBox="0 0 460 160" aria-hidden="true">
        <path d="M10 150H450" stroke="var(--rule)" stroke-width="1"/>
        <path d="M10 40H450" stroke="var(--accent3)" stroke-width="1.6" stroke-dasharray="7 6"/>
        <path d="M10 150L40 148L52 140L90 137L100 128L140 124L150 112L184 108L196 96L230 92L238 78L262 74L270 58L296 55L302 40"
              stroke="var(--accent2)" stroke-width="2.4"/>
        <circle cx="302" cy="40" r="6" fill="var(--accent3)" style="filter: drop-shadow(0 0 8px var(--accent3))"/>
        <text x="444" y="32" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="13" fill="var(--accent3)">L</text>
      </svg>

      <p class="code">404</p>
      <h1 id="nf-title">Cette page a franchi le <em>seuil de défaillance</em>.</h1>
      <p id="nf-text">Elle n'existe pas, ou plus. Aucune maintenance ne pourra la remettre à neuf.</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="/" id="nf-home">Retour à l'accueil</a>
        <a class="btn btn-ghost" href="/#labo" id="nf-lab">Aller au simulateur</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('site-lang'); } catch (e) {}
      if (!lang) lang = (navigator.language || 'fr').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
      if (lang !== 'en') return;
      document.documentElement.lang = 'en';
      document.title = 'Page not found | TITO Amedée Rytrace';
      document.getElementById('nf-title').innerHTML = 'This page has crossed its <em>failure threshold</em>.';
      document.getElementById('nf-text').textContent = "It doesn't exist, or no longer does. No maintenance can restore it to new.";
      document.getElementById('nf-home').textContent = 'Back to home';
      document.getElementById('nf-lab').textContent = 'Open the simulator';
    })();
  </script>
</body>
</html>
